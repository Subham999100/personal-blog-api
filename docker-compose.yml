services:
  postgres:
    image: postgres:18
    container_name: personal-blog-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_password
      POSTGRES_DB: personal_blog

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: